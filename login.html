<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — LostGameShop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Шапка сайта -->
    <header class="header">

        <img class="header__logo" src="img/logo.svg" alt="LostGameShop">

        <nav class="header__nav">
            <a class="header__link" href="index.html">Главная</a>
            <a class="header__link" href="index.html#games">Игры</a>
            <a class="header__link" href="login.html">Войти</a>
            <a class="header__link" href="register.html">Регистрация</a>
            <a class="header__link" href="profile.html">Личный кабинет</a>
        </nav>

    </header>

    <main>

        <!-- Форма входа -->
        <section class="form-section">

            <h1 class="form-section__title">
                Вход
            </h1>

            <form class="form">

                <label class="form__label" for="email">
                    E-mail
                </label>

                <input
                    class="form__input"
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label class="form__label" for="password">
                    Пароль
                </label>

                <input
                    class="form__input"
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button class="form__button" type="submit">
                    Войти
                </button>

            </form>

        </section>

    </main>

    <!-- Подвал сайта -->
    <footer class="footer">

        <div class="footer__info">
            <p>info@lostgs.ru</p>
            <p>О нас</p>
            <p>Контакты</p>
        </div>

        <nav class="footer__nav">
            <a class="footer__link" href="index.html">
                Главная
            </a>

            <a class="footer__link" href="register.html">
                Регистрация
            </a>

            <a class="footer__link" href="login.html">
                Авторизация
            </a>

            <a class="footer__link" href="profile.html">
                Личный кабинет
            </a>
        </nav>

    </footer>

</body>
</html>
